[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-uq-candidate"
version = "2.2.0"
description = "Public SOP-UQ remote agent, calibration baselines and reusable Qwen server"
requires-python = ">=3.11"
dependencies = ["sop-uq-protocol==2.2.0", "numpy>=1.24"]

[project.optional-dependencies]
model = ["torch==2.8.0", "transformers==5.19.0", "tokenizers==0.23.3", "huggingface-hub==2.2.0", "safetensors==0.8.0", "accelerate==1.15.0", "jinja2==3.1.6"]

[project.scripts]
sop-candidate = "sop_baselines.cli:main"
sop-qwen = "sop_qwen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sop_baselines = ["resources/*/*.txt", "resources/*/*.json", "resources/*/*.md"]
